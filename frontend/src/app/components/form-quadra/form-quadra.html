<div class="container">
  <a routerLink="/squadre" class="back">← Torna alle squadre</a>

  <h1>{{ modalita === 'inserimento' ? '➕ Nuova Squadra' : '✏️ Modifica Squadra' }}</h1>

  <div *ngIf="successo" class="alert-successo">✅ {{ successo }}</div>
  <div *ngIf="errore" class="alert-errore">❌ {{ errore }}</div>
  <div *ngIf="loading" class="loading">Caricamento...</div>

  <div class="form-card">

    <div class="form-gruppo" *ngIf="modalita === 'inserimento'">
      <label>Nome Squadra *</label>
      <input type="text" [(ngModel)]="squadra.nome_squadra" placeholder="Es. Juventus" />
    </div>

    <div class="form-row">
      <div class="form-gruppo">
        <label>Presidente *</label>
        <input type="text" [(ngModel)]="squadra.presidente" placeholder="Es. Andrea Agnelli" />
      </div>
      <div class="form-gruppo">
        <label>Capitano</label>
        <input type="text" [(ngModel)]="squadra.capitano" placeholder="Es. Giorgio Chiellini" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-gruppo">
        <label>Ranking *</label>
        <input type="number" [(ngModel)]="squadra.ranking" placeholder="Es. 1" />
      </div>
      <div class="form-gruppo">
        <label>Anno Fondazione *</label>
        <input type="number" [(ngModel)]="squadra.anno_fondazione" placeholder="Es. 1897" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-gruppo">
        <label>Numero Giocatori</label>
        <input type="number" [(ngModel)]="squadra.num_giocatori" />
      </div>
      <div class="form-gruppo">
        <label>Trofei Vinti</label>
        <input type="number" [(ngModel)]="squadra.trofei_vinti" />
      </div>
    </div>

    <div class="form-azioni">
      <button class="btn-salva" (click)="salva()" [disabled]="loading">
        {{ modalita === 'inserimento' ? 'Inserisci' : 'Salva modifiche' }}
      </button>
      <button
        *ngIf="modalita === 'modifica'"
        class="btn-elimina"
        (click)="elimina()"
        [disabled]="loading">
        🗑️ Elimina squadra
      </button>
    </div>

  </div>
</div>
